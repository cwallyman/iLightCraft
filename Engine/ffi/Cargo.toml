[package]
name = "ilightcraft-ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "ilightcraft_ffi"
crate-type = ["staticlib", "rlib"]

[features]
# Exposes uv_test_panic for the bridge tests; never enabled in app builds.
test-hooks = []

[dependencies]
lightcraft-engine = { workspace = true }
# Ship HEIC still-image decoding in every native app slice, without enabling AI models.
lightcraft-codecs = { workspace = true, features = ["heif"] }
lightcraft-gpu = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-denoise-core = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
half = "2.7.1"

[dev-dependencies]
png = { workspace = true }
dhat = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
